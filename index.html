<script>
/* =====================================================================
   RENDE MAIS CAMPANHAS — v5 (verbas de fomento por item)
   Lê a MESMA base do app Data Crítica (Supabase estciwkeihmokvlnvaum):
     produtos(ean, descricao, secao)
     produtos_loja(ean, loja, id_fornecedor, nome_fornecedor, ultimo_custo,
                   preco_venda, estoque, vmd)
     vendas_dia(ean, loja, data, qtd)      -> apuração da verba
     usuarios(id, nome, papel, loja, ativo, ids_fornecedor)
   Fornecedores são AGLUTINADOS pela razão social normalizada (mesma regra
   do relatório mensal do Data Crítica: trim + maiúsculas + espaços únicos),
   somando todos os id_fornecedor daquela razão social.
   Regras da verba:
     verba unitária sugerida = preço cheio − preço sugerido pelo fornecedor
     margem-alvo da seção    = piso de referência (alerta)
     limites de ORÇAMENTO e de PERÍODO, por item e pela campanha
     alerta em 70%; 100% suspende (campanha esgotada desfaz tudo)
   Campanhas, itens, aceites e histórico ficam NO BANCO (schema_campanhas.sql),
   para o fornecedor acompanhar e aceitar de qualquer lugar, do celular dele.
   Login: o mesmo usuário/PIN do Data Crítica (usuarios.pin_hash = sha256).
   ===================================================================== */
const CFG={ url:(location.search.match(/[?&]api=([^&]+)/)||[])[1]
              ? decodeURIComponent(RegExp.$1) : "https://estciwkeihmokvlnvaum.supabase.co",
            key:"sb_publishable_l14fjxQmWUeu5OXlZJ35GA_-X3ESkgZ" };
const LOJAS={L01:"Veneza",L02:"Máximo",L03:"Royal",L04:"Lojão",L05:"Alvorada",L08:"Tradição",L09:"Massangana"};
const LS='rendeMaisCampanhas_v5';
const LS_ANTIGO='verbasRM_v5';   // migra dados de quem já usou a versão anterior

const fmt=n=>(+n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtR=n=>'R$ '+fmt(n);
const pct=n=>((+n||0)*100).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
const hoje=()=>S.hojeSim||new Date().toISOString().slice(0,10);
const dbr=d=>d?String(d).slice(0,10).split('-').reverse().join('/'):'—';
const uid=()=>Math.random().toString(36).slice(2,9);
const el=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const soDig=s=>String(s||'').replace(/\D/g,'');
const semZ=s=>soDig(s).replace(/^0+/,'');
// chave de aglutinação de fornecedor — igual à do Data Crítica
const chaveForn=n=>String(n||'(sem nome)').trim().toUpperCase().replace(/\s+/g,' ');

let S=null, VIEW='', SEL=null, ONLINE=false, DB=false, DRAFT=null, TIMER=null;
const CACHE={itens:{}};                      // fornKey -> lista de produtos
const sha256=async t=>{ if(!crypto?.subtle) return null;
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); };

/* ---------------- acesso ao Supabase (REST) ---------------- */
function loading(b){ document.getElementById('load').style.display=b?'block':'none' }
async function sb(path,opts){
  const r=await fetch(CFG.url+'/rest/v1/'+path,{...opts,headers:{apikey:CFG.key,
    Authorization:'Bearer '+CFG.key,'Content-Type':'application/json',...(opts||{}).headers}});
  if(!r.ok) throw new Error(r.status+' '+(await r.text()).slice(0,200));
  return r.json();
}
async function sbPag(path,campo,limite=50000){       // paginação por Range
  const out=[]; let de=0, passo=1000;
  while(de<limite){
    const r=await fetch(CFG.url+'/rest/v1/'+path,{headers:{apikey:CFG.key,Authorization:'Bearer '+CFG.key,
      Range:`${de}-${de+passo-1}`,'Range-Unit':'items'}});
    if(!r.ok) throw new Error(r.status+' '+(await r.text()).slice(0,160));
    const d=await r.json(); out.push(...d);
    if(d.length<passo) break; de+=passo;
  }
  return out;
}

async function sbPost(tabela,corpo,prefer){
  return sb(tabela,{method:'POST',body:JSON.stringify(corpo),
    headers:{Prefer:prefer||'return=representation'}});
}
async function sbPatch(tabela,filtro,corpo){
  const r=await fetch(`${CFG.url}/rest/v1/${tabela}?${filtro}`,{method:'PATCH',
    headers:{apikey:CFG.key,Authorization:'Bearer '+CFG.key,'Content-Type':'application/json',Prefer:'return=minimal'},
    body:JSON.stringify(corpo)});
  if(!r.ok) throw new Error(r.status+' '+(await r.text()).slice(0,160));
}

/* ---------------- estado ---------------- */
function vazio(){ return {secoes:{},reps:[],campanhas:[],alertas:[],vendas:{},principais:[],
                          hojeSim:null,perfil:null,sessao:null,pctAlerta:.70,demo:false} }
function load(){
  try{S=JSON.parse(localStorage.getItem(LS)||localStorage.getItem(LS_ANTIGO))||vazio()}catch(e){S=vazio()}
  S=Object.assign(vazio(),S);
}
function save(){ localStorage.setItem(LS,JSON.stringify(S)) }

/* ---------------- carga do cadastro real ---------------- */
let FORN=[], USERS=[], MANUAIS=[], ITENS_MANUAIS={}, ABSORVIDA={};
async function conectar(){
  const st=document.getElementById('stConn');
  try{
    loading(true); st.textContent='lendo o cadastro do Data Crítica…';
    // 1) fornecedores: usa a view v_fornecedores_verbas se existir; senão varre produtos_loja
    let linhas=[];
    try{ linhas=await sb('v_fornecedores_lista?select=id_fornecedor,nome_fornecedor'); }
    catch(e){ linhas=await sbPag('produtos_loja?select=id_fornecedor,nome_fornecedor&id_fornecedor=not.is.null','',60000); }
    const mapa={};
    linhas.forEach(l=>{ if(!l.id_fornecedor) return;
      const k=chaveForn(l.nome_fornecedor);
      const a=mapa[k]||(mapa[k]={key:k,nome:l.nome_fornecedor||'(sem nome)',ids:new Set()});
      a.ids.add(l.id_fornecedor); });
    FORN=Object.values(mapa).map(a=>({key:a.key,nome:a.nome,ids:[...a.ids]}));
    try{                                        // fornecedores cadastrados à mão
      MANUAIS=await sb('fornecedores_manuais?select=*&ativo=eq.true');
      MANUAIS.forEach(m=>{
        const absorvidas=m.chaves_absorvidas||[];
        // um cadastro só: soma os id_fornecedor das razões sociais agrupadas
        const idsAbs=FORN.filter(f=>absorvidas.includes(f.key)).flatMap(f=>f.ids);
        const ids=[...new Set([...(m.ids_fornecedor||[]),...idsAbs])];
        const j=FORN.find(f=>f.key===m.fornecedor_chave);
        if(j){ j.manual=true; j.cnpjs=m.cnpjs; j.ids=[...new Set([...j.ids,...ids])]; j.absorvidas=absorvidas }
        else FORN.push({key:m.fornecedor_chave,nome:m.nome,ids,cnpjs:m.cnpjs||[],manual:true,absorvidas});
        if(absorvidas.length){                       // as razões sociais somem da lista
          FORN=FORN.filter(f=>!(absorvidas.includes(f.key)&&f.key!==m.fornecedor_chave));
          absorvidas.forEach(k=>ABSORVIDA[k]=m.fornecedor_chave);
        }
      });
    }catch(e){ MANUAIS=[]; console.warn('fornecedores manuais:',e.message) }
    FORN.sort((a,b)=>a.nome.localeCompare(b.nome));
    // 2) usuários (mesmos logins do Data Crítica)
    try{ USERS=await sb('usuarios?select=id,nome,papel,loja,ids_fornecedor&ativo=eq.true&order=nome') }
    catch(e){ USERS=await sb('usuarios?select=id,nome,papel,loja&ativo=eq.true&order=nome') }
    ONLINE=true; S.demo=false;
    // 3) as campanhas moram no banco? (schema_campanhas.sql aplicado)
    try{ await sb('campanhas?select=id&limit=1'); DB=true }catch(e){ DB=false }
    if(DB) await dbCarregar();
    st.textContent=`✅ base do VR · ${FORN.length} fornecedores`+(DB?' · campanhas no banco':' · ⚠️ campanhas só neste navegador');
  }catch(e){
    ONLINE=false; S.demo=true; demoBase();
    st.textContent='⚠️ sem conexão — modo demonstração';
    console.warn('Supabase:',e.message);
  }finally{ loading(false); save(); }
}
function demoBase(){
  FORN=[{key:'DISTRIBUIDORA NORDESTE ALIMENTOS LTDA',nome:'Distribuidora Nordeste Alimentos LTDA',ids:[1201,1202]},
        {key:'BEBIDAS RECIFE S/A',nome:'Bebidas Recife S/A',ids:[1310]},
        {key:'HIGIPLUS COMERCIAL LTDA',nome:'HigiPlus Comercial LTDA',ids:[1455]}];
  USERS=[{id:'u0',nome:'Gestor Comercial',papel:'gestor'},
    ...FORN.map((f,i)=>({id:'uf'+i,nome:f.nome,papel:'fornecedor',ids_fornecedor:f.ids.join(',')}))];
  const P=[['7891000100103','Leite Condensado 395g','Mercearia',4.62,6.49,'DISTRIBUIDORA NORDESTE ALIMENTOS LTDA',1201],
    ['7896036090015','Arroz Parboilizado 1kg','Mercearia',3.85,4.99,'DISTRIBUIDORA NORDESTE ALIMENTOS LTDA',1201],
    ['7891910000197','Açúcar Refinado 1kg','Mercearia',3.20,4.29,'DISTRIBUIDORA NORDESTE ALIMENTOS LTDA',1202],
    ['7891097000133','Requeijão 200g','Laticínios',5.10,7.49,'DISTRIBUIDORA NORDESTE ALIMENTOS LTDA',1201],
    ['7894900011517','Refrigerante Cola 2L','Bebidas',5.90,8.49,'BEBIDAS RECIFE S/A',1310],
    ['7891991000581','Cerveja Lata 350ml','Bebidas',2.55,3.49,'BEBIDAS RECIFE S/A',1310],
    ['7891035000119','Detergente 500ml','Limpeza',1.75,2.49,'HIGIPLUS COMERCIAL LTDA',1455],

  CACHE.itens={};

}

/* ---------------- campanhas no banco (acesso remoto do fornecedor) ---------------- */
const d10=v=>v?String(v).slice(0,10):'';        // aceita date ou timestamp
const mapItemDe=i=>({id:String(i.id),ean:i.ean,desc:i.descricao,secao:i.secao,
  preco:+i.preco_sugerido,verbaSug:+i.verba_sugerida,verba:+i.verba_unitaria,
  orcamento:+i.orcamento_item||0,inicio:d10(i.inicio_item),fim:d10(i.fim_item),
  custoRef:+i.custo_ref,precoRef:+i.preco_ref,alvoRef:+i.margem_alvo_ref,status:i.status});
const mapCampDe=r=>({id:String(r.id),fornKey:ABSORVIDA[r.fornecedor_chave]||r.fornecedor_chave,nome:r.nome,inicio:d10(r.inicio),fim:d10(r.fim),
  orcamento:+r.orcamento_total,lojas:r.lojas||[],repId:r.representante_id?String(r.representante_id):'',
  origem:r.origem,pagamento:r.pagamento,status:r.status,criadaEm:r.criada_em,
  itens:(r.campanha_itens||[]).map(mapItemDe).sort((a,b)=>a.desc.localeCompare(b.desc)),
  eventos:(r.campanha_eventos||[]).map(e=>({id:String(e.id),data:e.criado_em,tipo:e.tipo,
    item:(e.para||{}).item||null,autor:(e.para||{}).autor||'',msg:e.mensagem}))
    .sort((a,b)=>String(b.data).localeCompare(String(a.data)))});
const itemPara=(it,campId)=>({campanha_id:campId,ean:it.ean,descricao:it.desc,secao:it.secao,
  preco_sugerido:+it.preco||0,verba_sugerida:+it.verbaSug||0,verba_unitaria:+it.verba||0,
  orcamento_item:+it.orcamento||null,inicio_item:it.inicio||null,fim_item:it.fim||null,
  custo_ref:+it.custoRef||0,preco_ref:+it.precoRef||0,margem_alvo_ref:+it.alvoRef||0,status:it.status});

async function dbCarregar(){
  if(!DB) return;
  const fk=fornDoUsuario();
  const filtro=ehGestor()?'':`&fornecedor_chave=eq.${encodeURIComponent(fk||'-')}`;
  const cs=await sb(`campanhas?select=*,campanha_itens(*),campanha_eventos(*)&order=criada_em.desc${filtro}`);
  S.campanhas=cs.map(mapCampDe);
  try{
    S.reps=(await sb('representantes?select=*&ativo=eq.true')).map(r=>({id:String(r.id),fornKey:r.fornecedor_chave,
      nome:r.nome,cargo:r.cargo,email:r.email,tel:r.telefone,alerta:r.recebe_alertas}));
    S.principais=(await sb('fornecedores_principais?select=fornecedor_chave')).map(r=>r.fornecedor_chave);
    (await sb('secoes_margem?select=*')).forEach(r=>S.secoes[r.secao]=+r.margem_alvo);
  }catch(e){ console.warn('cadastros auxiliares:',e.message) }
  await apurar(true);          // o consumo vem do banco para os DOIS lados
  save();
}
async function recarregar(silencioso){
  if(!DB){ if(!silencioso) alert('As campanhas ainda não estão no banco — rode o schema_campanhas.sql.'); return }
  try{ await dbCarregar(); render() }catch(e){ if(!silencioso) alert('Falha ao atualizar: '+e.message) }
}
async function dbNovaCampanha(c){
  const f=FORN.find(x=>x.key===c.fornKey)||{ids:[]};
  const nova=(await sbPost('campanhas',{fornecedor_chave:c.fornKey,ids_fornecedor:f.ids,nome:c.nome,
    inicio:c.inicio,fim:c.fim,orcamento_total:+c.orcamento||0,lojas:c.lojas,
    representante_id:c.repId?+c.repId:null,origem:c.origem,pagamento:c.pagamento,status:c.status,
    criada_por:idUsuarioBanco()}))[0];
  await sbPost('campanha_itens',c.itens.map(it=>itemPara(it,nova.id)),'return=minimal');
  // o sync do VR só traz preço/custo/venda dos EANs que estão em `produtos` —
  // registra os itens da campanha lá para o mostrador passar a andar sozinho
  try{
    await fetch(CFG.url+'/rest/v1/produtos',{method:'POST',
      headers:{apikey:CFG.key,Authorization:'Bearer '+CFG.key,'Content-Type':'application/json',
               Prefer:'resolution=ignore-duplicates,return=minimal'},
      body:JSON.stringify(c.itens.map(it=>({ean:it.ean,descricao:(it.desc||'').slice(0,200),secao:it.secao||null})))});
  }catch(e){ console.warn('registro em produtos:',e.message) }
  await dbEvento(nova.id,null,'proposta',(c.eventos[0]||{}).msg||'Campanha criada.');
  return String(nova.id);
}
async function dbSyncCamp(c){
  if(!DB||!/^\d+$/.test(c.id)) return;
  try{
    await sbPatch('campanhas',`id=eq.${c.id}`,{nome:c.nome,inicio:c.inicio,fim:c.fim,
      orcamento_total:+c.orcamento||0,lojas:c.lojas,pagamento:c.pagamento,status:c.status,
      representante_id:c.repId?+c.repId:null});
    for(const it of c.itens){
      if(/^\d+$/.test(it.id)) await sbPatch('campanha_itens',`id=eq.${it.id}`,itemPara(it,+c.id));
    }
  }catch(e){ console.warn('sync campanha:',e.message) }
}
async function dbEvento(campId,itemId,tipo,msg){

/* itens de um fornecedor (todas as lojas), com custo e preço reais */
async function itensDoForn(fk){
  if(CACHE.itens[fk]) return CACHE.itens[fk];
  const f=FORN.find(x=>x.key===fk); if(!f) return [];
  loading(true);
  try{
    const pl = f.ids.length
      ? await sbPag(`produtos_loja?select=ean,loja,ultimo_custo,preco_venda,estoque,vmd14,id_fornecedor,nome_fornecedor&id_fornecedor=in.(${f.ids.join(',')})`,'',40000)
      : [];
    const eans=[...new Set(pl.map(x=>x.ean))];
    const descr={};
    for(let i=0;i<eans.length;i+=300){
      const parte=eans.slice(i,i+300).map(e=>`"${e}"`).join(',');
      (await sb(`produtos?select=ean,descricao,secao&ean=in.(${parte})`)).forEach(p=>descr[p.ean]=p);
    }
    const m={};
    pl.forEach(r=>{
      const it=m[r.ean]||(m[r.ean]={ean:r.ean,desc:(descr[r.ean]||{}).descricao||r.ean,
        secao:(descr[r.ean]||{}).secao||'(sem seção)',idf:r.id_fornecedor,lojas:{}});
      it.lojas[r.loja]={custo:+r.ultimo_custo||0,preco:+r.preco_venda||0,estoque:+r.estoque||0,vmd:+r.vmd14||0};
    });
    // itens associados manualmente a este fornecedor
    try{
      const mi=await sb(`fornecedor_itens_manuais?select=*&fornecedor_chave=eq.${encodeURIComponent(fk)}`);
      ITENS_MANUAIS[fk]=mi;
      for(const x of mi){
        if(m[x.ean]) continue;                       // já veio da base do VR
        let lojas={};
        const base=await sb(`produtos_loja?select=loja,ultimo_custo,preco_venda,estoque&ean=eq.${encodeURIComponent(x.ean)}`).catch(()=>[]);
        if(base.length) base.forEach(r=>lojas[r.loja]={custo:+r.ultimo_custo||0,preco:+r.preco_venda||0,estoque:+r.estoque||0});
        else Object.keys(LOJAS).forEach(l=>lojas[l]={custo:+x.custo||0,preco:+x.preco||0,estoque:0});
        m[x.ean]={ean:x.ean,desc:x.descricao||x.ean,secao:x.secao||'(sem seção)',manual:true,lojas};
      }
    }catch(e){ console.warn('itens manuais:',e.message) }
    Object.values(m).forEach(it=>{                 // SKU ativo = tem preço e (estoque ou giro)
      const ls=Object.values(it.lojas);
      it.ativo = ls.some(l=>l.preco>0) && (ls.some(l=>l.estoque>0) || ls.some(l=>l.vmd>0) || it.manual);
    });
    CACHE.itens[fk]=Object.values(m).sort((a,b)=>a.desc.localeCompare(b.desc));
  }catch(e){ alert('Não consegui ler os itens: '+e.message); CACHE.itens[fk]=[] }
  finally{ loading(false) }
  return CACHE.itens[fk];
}
const itensCache=fk=>CACHE.itens[fk]||[];
function achaEAN(fk,ean){ const a=semZ(ean);
  return itensCache(fk).find(p=>semZ(p.ean)===a)||null; }
function achaEANqualquer(ean){ const a=semZ(ean);
  for(const k in CACHE.itens){ const p=CACHE.itens[k].find(x=>semZ(x.ean)===a); if(p) return {p,fk:k} }
  return null; }

/* referências de custo e preço cheio nas lojas da campanha */
function refs(prd,lojas){
  const ls=(lojas||Object.keys(LOJAS)).map(l=>prd.lojas[l]).filter(Boolean);
  if(!ls.length) return {custo:0,preco:0,precoMin:0,precoMax:0};
  const precos=ls.map(x=>x.preco).filter(x=>x>0), custos=ls.map(x=>x.custo).filter(x=>x>0);
  return {custo:Math.max(...custos,0), preco:Math.max(...precos,0),
          precoMin:Math.min(...precos,0||Infinity), precoMax:Math.max(...precos,0)};
}

function verbaSugerida(precoCheio,precoPromo){ return Math.max(0,+((+precoCheio||0)-(+precoPromo||0)).toFixed(4)) }
function margemCom(p,c,v){ return p? (p-(c-v))/p : 0 }
function margemRS(p,c,v){ return (+p||0)-((+c||0)-(+v||0)) }
const ehGestor=()=>usuario()?.papel==='gestor';
const usuario=()=>USERS.find(u=>String(u.id)===String(S.perfil));
function fornDoUsuario(){
  const u=usuario(); if(!u||u.papel==='gestor') return null;
  const ids=String(u.ids_fornecedor||u.id_fornecedor||'').split(',').map(x=>parseInt(x)).filter(Boolean);
  const f=FORN.find(x=>x.ids.some(i=>ids.includes(+i)));

function minhasCamps(){ const f=fornDoUsuario();
  return S.campanhas.filter(c=>ehGestor()||c.fornKey===f) }
const camp=id=>S.campanhas.find(c=>c.id===id);
function itemPeriodo(c,it){ return {ini:it.inicio||c.inicio, fim:it.fim||c.fim} }
function consumoItem(c,it){
  const per=itemPeriodo(c,it); let un=0;
  Object.entries(S.vendas).forEach(([k,q])=>{
    const [ean,loja,data]=k.split('|');
    if(semZ(ean)!==semZ(it.ean)) return;
    if(!c.lojas.includes(loja)) return;
    if(data<per.ini||data>per.fim) return;
    un+=q;
  });
  return {un,verba:un*(+it.verba||0)};
}
function consumoCamp(c){ return c.itens.reduce((a,it)=>{const x=consumoItem(c,it);
  return {un:a.un+x.un, verba:a.verba+x.verba}},{un:0,verba:0}) }
function itemVigente(c,it){
  if(it.status!=='aprovado'||c.status!=='vigente') return false;
  const p=itemPeriodo(c,it), h=hoje(); return h>=p.ini&&h<=p.fim;
}
function statusTag(st){

    aguardando_fornecedor:['wait','Aguardando o Fornecedor'],vigente:['ok','Vigente'],aprovado:['ok','Aprovado'],

    encerrado:['off','Encerrado'],encerrada:['off','Encerrada']};

/* ---------------- motor de limites ---------------- */
function avaliar(){
  const h=hoje();
  S.campanhas.forEach(c=>{
    if(!['vigente','suspensa_orcamento'].includes(c.status)) return;
    const antes=c.status+'|'+c.itens.map(i=>i.status).join(',');
    const cc=consumoCamp(c).verba;
    const mudou=()=>antes!==c.status+'|'+c.itens.map(i=>i.status).join(',');
    if(c.fim<h){
      c.status='encerrada'; c.itens.forEach(i=>{if(['aprovado','suspenso_orcamento'].includes(i.status))i.status='encerrado'});
      alerta('atencao','fim_camp_'+c.id,`Campanha "${c.nome}" encerrada — fim da vigência (${dbr(c.fim)}).`,c.id); dbSyncCamp(c); return;
    }
    if(cc>=c.orcamento){
      if(c.status==='vigente'){
        c.status='suspensa_orcamento';
        c.itens.forEach(i=>{if(i.status==='aprovado')i.status='suspenso_orcamento'});
        alerta('critico','estouro_camp_'+c.id,`Orçamento da campanha "${c.nome}" esgotado (${fmtR(cc)} de ${fmtR(c.orcamento)}). TODAS as promoções foram desfeitas — aumente o orçamento para reativar ou estanque a campanha.`,c.id);
        ev(c,null,'suspensao','Orçamento da campanha esgotado — promoções desfeitas.');
      }
    } else if(cc>=S.pctAlerta*c.orcamento){
      alerta('atencao','70_camp_'+c.id,`Campanha "${c.nome}" atingiu ${pct(cc/c.orcamento)} do orçamento (${fmtR(cc)} de ${fmtR(c.orcamento)}).`,c.id);
    }
    c.itens.forEach(it=>{
      const per=itemPeriodo(c,it);
      if(it.status==='aprovado'&&per.fim<h){
        it.status='encerrado';
        alerta('atencao','fim_item_'+it.id,`"${it.desc}" encerrado — fim da vigência do item (${dbr(per.fim)}).`,c.id,it.id); return;
      }
      if(!it.orcamento) return;
      const ci=consumoItem(c,it).verba;
      if(ci>=it.orcamento){
        if(it.status==='aprovado'){
          it.status='suspenso_orcamento';
          alerta('critico','estouro_item_'+it.id,`Orçamento do item "${it.desc}" esgotado (${fmtR(ci)} de ${fmtR(it.orcamento)}) — promoção suspensa. Aumente o orçamento do item ou estanque a promoção dele.`,c.id,it.id);
          ev(c,it,'suspensao','Orçamento do item esgotado.');
        }
      } else if(ci>=S.pctAlerta*it.orcamento){
        alerta('atencao','70_item_'+it.id,`"${it.desc}" atingiu ${pct(ci/it.orcamento)} do orçamento do item (${fmtR(ci)} de ${fmtR(it.orcamento)}).`,c.id,it.id);
      }
    });
    if(mudou()) dbSyncCamp(c);
  });
  save();
}

/* ---------------- apuração real (vendas_dia do VR) ---------------- */
async function apurar(silencioso){
  if(!ONLINE){ if(!silencioso) alert('Sem conexão — no modo demonstração use o botão de simular.'); return }
  const ativos=S.campanhas.filter(c=>['vigente','suspensa_orcamento','encerrada','estancada'].includes(c.status));
  const eans=[...new Set(ativos.flatMap(c=>c.itens.map(i=>i.ean)))];
  if(!eans.length){ if(!silencioso) alert('Nenhum item aprovado para apurar.'); return }
  const corte=ativos.reduce((a,c)=>c.inicio<a?c.inicio:a,'9999-12-31');
  if(!silencioso) loading(true);
  try{
    let n=0;
    for(let i=0;i<eans.length;i+=200){
      const parte=eans.slice(i,i+200).map(e=>`"${e}"`).join(',');
      const vd=await sbPag(`vendas_dia?select=ean,loja,data,qtd&ean=in.(${parte})&data=gte.${corte}`,'',40000);
      vd.forEach(v=>{ S.vendas[`${v.ean}|${v.loja}|${String(v.data).slice(0,10)}`]=+v.qtd||0; n++ });
    }
    S.ultimaApuracao=new Date().toISOString();
    save(); avaliar();
    if(!silencioso){ render(); alert(`Apuração concluída: ${n} registros de venda lidos do VR.`) }
  }catch(e){ if(!silencioso) alert('Falha na apuração: '+e.message); else console.warn('apuração:',e.message) }
  finally{ if(!silencioso) loading(false) }
}

/* ---------------- componentes ---------------- */
function meter(cons,orc,label){
  const r=orc?cons/orc:0;
  const cor=r>=1?'var(--crit)':r>=S.pctAlerta?'var(--warn)':'var(--good)';
  const ic=r>=1?'⛔':r>=S.pctAlerta?'⚠️':'✅';
  return `<div>
    <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-bottom:4px">
      <span>${label||''}</span><span>${ic} <b>${fmtR(cons)}</b> de ${fmtR(orc)} · ${orc?pct(Math.min(r,9.99)):'—'}</span></div>
    <div class="meter"><i style="width:${Math.min(r,1)*100}%;background:${cor}"></i>
      <span class="lim" style="left:${S.pctAlerta*100}%"></span></div>
    <div class="small" style="margin-top:3px">Saldo: <b style="color:${orc-cons<0?'var(--crit)':'inherit'}">${fmtR(orc-cons)}</b></div></div>`;
}

async function addPorEAN(codigos){
  const campo=document.getElementById('nEan');
  const lista=[...new Set(String(codigos||(campo?campo.value:'')).split(/[\s,;]+/).map(soDig).filter(Boolean))];
  if(!lista.length) return;
  const ok=[],outro=[],nao=[],ja=[],pendentes=[],doCatalogo=[];
  lista.forEach(e=>{
    const p=achaEAN(DRAFT.fornKey,e);
    if(p){ if(DRAFT.itens.some(i=>semZ(i.ean)===semZ(e))) ja.push(p); else {DRAFT.itens.push(novoItemDe(p)); ok.push(p)} return }
    const alheio=achaEANqualquer(e);
    if(alheio){ outro.push({e,...alheio}); return }
    pendentes.push(e);
  });
  // procura no catálogo do VR (180 mil EANs) o que não está no portfólio carregado
  if(pendentes.length&&ONLINE){
    try{
      const lista=pendentes.map(e=>'"'+e+'"').join(',');
      const achados=await sb(`catalogo?select=ean,descricao&ean=in.(${lista})`);
      achados.forEach(x=>{
        const p={ean:x.ean,desc:x.descricao||x.ean,secao:'(sem seção)',semPreco:true,
                 lojas:Object.fromEntries(DRAFT.lojas.map(l=>[l,{custo:0,preco:0,estoque:0,vmd:0}]))};
        (CACHE.itens[DRAFT.fornKey]=CACHE.itens[DRAFT.fornKey]||[]).push(p);
        DRAFT.itens.push(novoItemDe(p)); doCatalogo.push(p);
      });
      const achou=new Set(achados.map(x=>semZ(x.ean)));
      pendentes.filter(e=>!achou.has(semZ(e))).forEach(e=>nao.push(e));
    }catch(err){ pendentes.forEach(e=>nao.push(e)) }
  } else pendentes.forEach(e=>nao.push(e));
  const resto=[...outro.map(x=>x.e),...nao].join('\n');
  save(); render();
  const novo=document.getElementById('nEan'); if(novo) novo.value=resto;
  const box=document.getElementById('eanMsg'); if(!box) return;
  let h='';
  if(doCatalogo.length) h+=`<div class="alert w">📦 <b>${doCatalogo.length} item(ns) do catálogo do VR sem preço na base ainda:</b> ${doCatalogo.map(x=>x.desc).join(', ')}.
      Entraram na campanha; preço, custo e venda chegam no próximo sync (informe a verba e o preço promocional normalmente).</div>`;
  if(ok.length)    h+=`<div class="alert i">✅ <b>${ok.length} item(ns) adicionado(s):</b> ${ok.map(x=>x.desc).join(', ')}</div>`;
  if(ja.length)    h+=`<div class="alert w">⚠️ Já estavam na campanha: ${ja.map(x=>x.desc).join(', ')}</div>`;
  if(outro.length) h+=`<div class="alert">🔴 <b>Não é da base deste fornecedor:</b> ${outro.map(x=>`${x.e} — ${x.p.desc} (${fornNome(x.fk)})`).join('; ')}</div>`;
  if(nao.length)   h+=`<div class="alert">🔴 <b>EAN não encontrado no portfólio deste fornecedor:</b> ${nao.join(', ')}</div>`;
  if(ehGestor()&&(nao.length||outro.length))
    h+=`<div class="alert i">➕ Quer incluir esse(s) item(ns) manualmente no portfólio de <b>${fornNome(DRAFT.fornKey)}</b>?
      <div style="margin-top:6px"><button class="b s" onclick="itensManuais('${DRAFT.fornKey.replace(/'/g,"&#39;")}','${[...nao,...outro.map(x=>x.e)][0]||''}')">Cadastrar item manualmente</button></div></div>`;
  box.innerHTML=h;
}
async function scanEAN(){
  if(!('BarcodeDetector' in window)) return alert('Este navegador não tem leitor de código de barras.');
  try{
    const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','code_128']});
    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=document.createElement('video'); v.srcObject=st; v.setAttribute('playsinline',''); await v.play();
    const dlg=document.getElementById('dlg'), inn=document.getElementById('dlgIn');
    inn.innerHTML='<h2>Aponte para o código de barras</h2>'; v.style.width='100%'; inn.appendChild(v);
    const bt=el('<button class="b o" style="margin-top:10px">Fechar</button>'); inn.appendChild(bt); dlg.showModal();
    const parar=()=>{st.getTracks().forEach(t=>t.stop()); dlg.close()}; bt.onclick=parar;
    const loop=async()=>{ if(!dlg.open) return;
      try{const r=await det.detect(v); if(r.length){parar(); addPorEAN(r[0].rawValue); return}}catch(e){}
      requestAnimationFrame(loop)}; loop();
  }catch(e){ alert('Não consegui abrir a câmera: '+e.message) }
}

        <button class="b s o" onclick="stepVerba('${it.id}',0.05)">+</button></div></div>
      <div><label>Orçamento deste item (R$)</label><input type="number" step="0.01" value="${it.orcamento||''}" placeholder="sem teto próprio" oninput="setIt('${it.id}','orcamento',this.value)"></div>

    ${menos?`<div class="alert">🔴 <b>Verba abaixo da sugerida.</b> Com ${fmtR(vb)} (sugerido ${fmtR(vs)}) a margem cai de ${fmtR(mgHoje)} para <b>${fmtR(mgRS)}</b> (${pct(mg)}) — perda de ${fmtR(vs-vb)} por unidade vendida.</div>`:''}
    ${(!menos&&abaixo)?`<div class="alert w">⚠️ Mesmo com a verba cheia a margem fica em ${pct(mg)}, abaixo do alvo de ${pct(alvo)} da seção ${it.secao}.</div>`:''}</div>`;

async function enviar(jaAcordada){
  const d=DRAFT, g=ehGestor();
  if(!d.nome) return alert('Dê um nome à campanha.');
  if(!d.lojas.length) return alert('Escolha ao menos uma loja.');
  if(d.fim<d.inicio) return alert('Período geral inválido.');
  d.origem=g?'gestor':'fornecedor';
  d.status=g?(jaAcordada?'vigente':'aguardando_fornecedor'):'aguardando_aceite';
  d.criadaEm=new Date().toISOString();
  d.itens.forEach(i=>{i.status=(g&&jaAcordada)?'aprovado':(g?'aguardando_fornecedor':'aguardando_aceite'); i.orcamento=+i.orcamento||0});
  const msg=`${g?'Campanha criada pelo Gestor':'Proposta do fornecedor'}: ${d.itens.length} itens, orçamento ${fmtR(d.orcamento)}, pagamento ${d.pagamento==='antecipado'?'antecipado':'após apuração'}.`;
  const c=JSON.parse(JSON.stringify(d)); c.eventos=[{id:uid(),data:c.criadaEm,tipo:'proposta',autor:usuario()?.nome,msg}];
  if(DB){
    loading(true);
    try{ await dbNovaCampanha(c); await dbCarregar(); }
    catch(e){ loading(false); return alert('Não consegui gravar no banco: '+e.message) }
    loading(false);
    alert(g?(jaAcordada?'Campanha em vigência. O fornecedor já vê no portal dele.'
                       :'Proposta enviada — o fornecedor recebe no portal e dá o aceite de onde estiver.')
           :'Proposta enviada ao Gestor.');
  } else {
    S.campanhas.unshift(c); save();
    alert('Gravado só neste navegador — rode o schema_campanhas.sql para o fornecedor enxergar à distância.');
  }
  if(g&&!jaAcordada) alerta('atencao','prop_gestor_'+(S.campanhas[0]||{}).id,`O Gestor propôs a campanha "${c.nome}".`,(S.campanhas[0]||{}).id);
  novoDraft(d.fornKey).then(()=>go(g?'painel':'minhas'));
}

function lerAprov(c,it){
  const g=p=>document.getElementById(p+it.id);
  const de={preco:it.preco,verba:it.verba,orcamento:it.orcamento,inicio:it.inicio,fim:it.fim};
  if(g('a_p_')){ it.preco=+g('a_p_').value; it.verba=+g('a_v_').value; it.orcamento=+g('a_o_').value||0;
                 it.inicio=g('a_i_').value||''; it.fim=g('a_f_').value||''; }
  it.verbaSug=verbaSugerida(it.precoRef,it.preco);
  return Object.keys(de).filter(k=>String(de[k]||'')!==String(it[k]||'')).map(k=>`${k}: ${de[k]||'—'} → ${it[k]||'—'}`).join('; ');
}
function lerGeral(c){ const g=p=>document.getElementById(p+c.id);

                 c.orcamento=+g('g_o_').value||c.orcamento } }
function contra(cid,iid){ const c=camp(cid), it=c.itens.find(i=>i.id===iid);
  lerGeral(c); const dif=lerAprov(c,it); ev(c,it,'alteracao_gestor',dif||'sem alterações');
  save(); dbSyncCamp(c); render(); alert('Alteração salva. O item continua aguardando aceite.'); }
function decidir(cid,iid,ok){
  const c=camp(cid), it=c.itens.find(i=>i.id===iid);
  lerGeral(c); const dif=lerAprov(c,it);
  it.status=ok?'aprovado':'recusado';
  ev(c,it,ok?'aceite':'recusa',(dif?`alterado (${dif}); `:'')+(ok?`aceito a ${fmtR(it.preco)} com verba de ${fmtR(it.verba)}/un.`:'recusado'));
  if(c.itens.some(i=>i.status==='aprovado')&&['aguardando_aceite','aguardando_fornecedor'].includes(c.status)) c.status='vigente';
  if(c.itens.every(i=>i.status==='recusado')) c.status='recusada';
  save(); dbSyncCamp(c); render();

function decidirTudo(cid,ok){
  const c=camp(cid); lerGeral(c);
  if(!ok&&!confirm('Recusar toda a campanha?')) return;
  c.itens.filter(i=>i.status===stPend()).forEach(it=>{lerAprov(c,it); it.status=ok?'aprovado':'recusado'});
  c.status=ok?'vigente':'recusada';
  ev(c,null,ok?'aceite':'recusa',(ok?'Campanha aceita ':'Campanha recusada ')+(ehGestor()?'pelo Gestor':'pelo Fornecedor')+'.');
  save(); dbSyncCamp(c); render();
}

    cnpjs:g('mfCnpj').split(',').map(x=>x.trim()).filter(Boolean),
    ids_fornecedor:g('mfIds').split(',').map(x=>parseInt(x)).filter(Boolean),
    observacao:g('mfObs')||null,criado_por:idUsuarioBanco()};
  if(DB){ try{ await sbPost('fornecedores_manuais',reg,'return=minimal') }

  if(grupos.length<2) return alert('Marque pelo menos dois cadastros.');
  const palavras=grupos.map(g=>g.nome.split(/\s+/)[0]);
  const sugestao=palavras.every(p=>p===palavras[0])?palavras[0]:grupos[0].nome;
  const nome=prompt(`Juntar ${grupos.length} cadastros num só.\n\n${grupos.map(g=>'• '+g.nome+' ('+g.ids.join(',')+')').join('\n')}\n\nNome do cadastro único:`,sugestao);
  if(!nome) return;
  const chave=chaveForn(nome);
  const ids=[...new Set(grupos.flatMap(g=>g.ids))];
  const absorvidas=[...new Set([...grupos.map(g=>g.key),...grupos.flatMap(g=>g.absorvidas||[])])];
  const reg={fornecedor_chave:chave,nome,ids_fornecedor:ids,chaves_absorvidas:absorvidas,
             cnpjs:[...new Set(grupos.flatMap(g=>g.cnpjs||[]))],criado_por:idUsuarioBanco()};
  loading(true);
  try{
    if(DB){
      const ja=MANUAIS.find(m=>m.fornecedor_chave===chave);
      if(ja) await sbPatch('fornecedores_manuais',`fornecedor_chave=eq.${encodeURIComponent(chave)}`,
              {nome,ids_fornecedor:ids,chaves_absorvidas:absorvidas,ativo:true});
      else    await sbPost('fornecedores_manuais',reg,'return=minimal');
    }
    SELF=[]; CACHE.itens={}; await conectar(); await itensDoForn(chave); render();
    const n=itensCache(chave).filter(i=>i.ativo!==false).length;
    alert(`Pronto: ${nome} agora é um cadastro só, com ${ids.length} id_fornecedor e ${n} SKUs ativos importados.`);
  }catch(e){ alert('Não consegui agrupar: '+e.message) }
  finally{ loading(false) }
}
function togPrincipal(k){ const i=S.principais.indexOf(k); i<0?S.principais.push(k):S.principais.splice(i,1); save(); render() }

/* ---------------- representantes ---------------- */
function vRep(m){
  m.appendChild(el(`<div class="card"><h2>Representantes dos fornecedores</h2>
    <p class="small">Quem negocia a campanha. O marcado recebe os alertas de 70% e de estouro.</p>
    <div class="tw"><table>
      <tr><th>Fornecedor</th><th>Nome</th><th>Cargo</th><th>E-mail</th><th>Telefone</th><th>Alertas</th><th></th></tr>
      ${S.reps.map(r=>`<tr><td class="small">${fornNome(r.fornKey)}</td>
        <td><input value="${r.nome}" onchange="setRep('${r.id}','nome',this.value)"></td>
        <td><input value="${r.cargo||''}" onchange="setRep('${r.id}','cargo',this.value)"></td>
        <td><input value="${r.email||''}" onchange="setRep('${r.id}','email',this.value)"></td>
        <td><input value="${r.tel||''}" onchange="setRep('${r.id}','tel',this.value)"></td>
        <td style="text-align:center"><input type="checkbox" ${r.alerta?'checked':''} onchange="setRep('${r.id}','alerta',this.checked)"></td>
        <td><button class="b s o" onclick="delRep('${r.id}')">excluir</button></td></tr>`).join('')
        ||'<tr><td colspan="7" class="small">Nenhum representante cadastrado.</td></tr>'}</table></div>
    <h3>Adicionar</h3>
    <div class="row">
      <div style="flex:2 1 240px"><label>Fornecedor</label><select id="rForn">${ordForn().slice(0,400).map(f=>
        `<option value="${f.key}">${S.principais.includes(f.key)?'★ ':''}${f.nome}</option>`).join('')}</select></div>
      <div><label>Nome</label><input id="rNome"></div>
      <div><label>Cargo</label><input id="rCargo" placeholder="Representante, supervisor, KAM..."></div>
      <div><label>E-mail</label><input id="rEmail" type="email"></div>
      <div><label>Telefone</label><input id="rTel"></div>
      <div style="flex:0 0 auto;align-self:flex-end"><button class="b" onclick="addRep()">+ Adicionar</button></div></div></div>`));
}
function setRep(id,k,v){ const r=S.reps.find(x=>x.id===id); r[k]=v; save() }
function delRep(id){ if(confirm('Excluir representante?')){ S.reps=S.reps.filter(r=>r.id!==id); save(); render() } }
function addRep(){ const g=i=>document.getElementById(i).value.trim();
  if(!g('rNome')) return alert('Informe o nome.');
  S.reps.push({id:uid(),fornKey:g('rForn'),nome:g('rNome'),cargo:g('rCargo'),email:g('rEmail'),tel:g('rTel'),alerta:true});
  save(); render(); }

/* ---------------- seções e parâmetros ---------------- */
function vCad(m){
  const secoes=[...new Set([...Object.keys(S.secoes),...Object.values(CACHE.itens).flat().map(p=>p.secao)])].sort();
  m.appendChild(el(`<div class="card"><h2>Margem-alvo por seção</h2>
    <p class="small">A verba sugerida é <b>preço cheio − preço sugerido</b> (mantém a margem em R$). A margem-alvo abaixo é o <b>piso de referência</b>: se a margem ficar abaixo dela mesmo com a verba cheia, o app avisa. As seções vêm de <code>produtos.secao</code>.</p>
    <div class="tw"><table><tr><th>Seção</th><th class="n">Margem-alvo</th></tr>
      ${secoes.map(s=>`<tr><td>${s}</td><td class="n"><input type="number" step="0.5" style="width:90px;text-align:right"
        value="${(alvoSecao(s)*100).toFixed(1)}" onchange="S.secoes['${s.replace(/'/g,"\\'")}']=+this.value/100;save()"> %</td></tr>`).join('')
        ||'<tr><td colspan="2" class="small">Carregue o portfólio de um fornecedor para as seções aparecerem.</td></tr>'}</table></div></div>`));
  m.appendChild(el(`<div class="card"><h2>Parâmetros</h2>
    <div class="row"><div><label>Alerta de consumo em (%)</label>
      <input type="number" step="1" value="${(S.pctAlerta*100).toFixed(0)}" onchange="S.pctAlerta=+this.value/100;save();render()"></div>
      <div style="flex:2 1 300px"><label>Supabase (mesmo projeto do Data Crítica)</label><input value="${CFG.url}" disabled></div></div>
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="b o s" onclick="conectar().then(render)">Recarregar cadastro do VR</button>
      <button class="b o s" onclick="if(confirm('Apagar campanhas, alertas e apuração deste navegador?')){localStorage.removeItem(LS);load();render()}">Zerar dados locais</button></div></div>`));
}

/* ---------------- apuração ---------------- */
function vSim(m){
  const vig=S.campanhas.filter(c=>c.status==='vigente').flatMap(c=>c.itens.filter(i=>itemVigente(c,i)));
  m.appendChild(el(`<div class="card"><h2>Apuração da verba</h2>
    <p class="small">A verba consumida = unidades vendidas × verba unitária, lendo <code>vendas_dia</code> (ean, loja, data, qtd) —
    a mesma tabela que o sync do VR alimenta para o Data Crítica. Só contam as lojas e o período de cada item.</p>
    <div class="kpi">
      <div><span>Itens em promoção agora</span><b>${vig.length}</b></div>
      <div><span>Última apuração</span><b style="font-size:15px">${S.ultimaApuracao?dbr(S.ultimaApuracao)+' '+S.ultimaApuracao.slice(11,16):'—'}</b></div>
      <div><span>Conexão</span><b style="font-size:15px">${ONLINE?'Supabase OK':'demonstração'}</b></div></div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="b" onclick="apurar()" ${ONLINE?'':'disabled'}>Apurar agora (vendas do VR)</button>
      ${ONLINE?'':'<button class="b o" onclick="simular(1)">Simular 1 dia (demonstração)</button><button class="b o" onclick="simular(7)">Simular 7 dias</button>'}
      <button class="b o" onclick="S.vendas={};S.alertas=[];S.campanhas.forEach(c=>{if(c.status==='suspensa_orcamento')c.status='vigente';c.itens.forEach(i=>{if(i.status==='suspenso_orcamento')i.status='aprovado'})});save();render()">Zerar apuração</button>
      <div style="flex:1 1 160px"><label>Data de referência (teste)</label>
        <input type="date" value="${hoje()}" onchange="S.hojeSim=this.value;save();render()"></div></div></div>`));

  m.appendChild(el(`<div class="card"><h2>Consumo por item</h2><div class="tw"><table>
    <tr><th>Fornecedor</th><th>Campanha</th><th>Item</th><th class="n">Un.</th><th class="n">Verba</th><th class="n">% do teto</th></tr>
    ${S.campanhas.flatMap(c=>c.itens.map(it=>{const x=consumoItem(c,it); if(!x.un) return '';
      return `<tr><td class="small">${fornNome(c.fornKey)}</td><td class="small">${c.nome}</td><td>${it.desc}</td>
        <td class="n">${fmt(x.un)}</td><td class="n">${fmtR(x.verba)}</td>
        <td class="n">${it.orcamento?pct(x.verba/it.orcamento):'—'}</td></tr>`})).join('')
      ||'<tr><td colspan="6" class="small">Nenhuma venda apurada ainda.</td></tr>'}</table></div></div>`));
}
function simular(dias){
  for(let d=0;d<dias;d++){
    const data=hoje();
    S.campanhas.filter(c=>c.status==='vigente').forEach(c=>{
      c.itens.filter(i=>itemVigente(c,i)).forEach(it=>{
        c.lojas.forEach(l=>{ const k=`${it.ean}|${l}|${data}`;
          S.vendas[k]=(S.vendas[k]||0)+Math.round(3+Math.random()*9) }) }) });
    avaliar();
    if(dias>1){ const n=new Date(hoje()); n.setDate(n.getDate()+1); S.hojeSim=n.toISOString().slice(0,10) }
  }
  save(); render();
}

/* ---------------- login com o PIN do Data Crítica ---------------- */
function telaLogin(){
  document.getElementById('nav').innerHTML='';
  document.getElementById('perfil').style.display='none';
  const m=document.getElementById('app'); m.innerHTML='';
  const ultimo=localStorage.getItem('rmc_ultimo_nome')||'';
  const modoOutra=LG_OUTRA||!ultimo;
  const campoUser=modoOutra
    ? `<div style="margin-bottom:10px"><label>Seu nome</label>
        <input id="lgNome" placeholder="Digite seu nome" autocomplete="off"></div>`
    : `<div style="margin-bottom:10px"><label>Usuário</label>
        <div class="card" style="background:#f5f7fa;padding:10px;margin:0">
          <b>${ultimo}</b><div class="small">Digite o PIN para entrar</div></div>
        <input type="hidden" id="lgNome" value="${ultimo.replace(/"/g,'&quot;')}"></div>`;
  m.appendChild(el(`<div class="card" style="max-width:420px;margin:40px auto">
    <h2>Entrar</h2>
    <p class="small">Use o mesmo usuário e PIN do app Data Crítica. Fornecedor entra de qualquer lugar e vê só as campanhas dele.</p>
    ${campoUser}
    <div style="margin-bottom:12px"><label>PIN</label>
      <input id="lgP" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password"
        onkeydown="if(event.key==='Enter')entrar()"></div>
    <button class="b" style="width:100%" onclick="entrar()">Entrar</button>
    ${modoOutra
      ? (ultimo?`<p class="small" style="text-align:center;margin-top:10px;cursor:pointer" onclick="LG_OUTRA=false;render()">‹ Voltar para ${ultimo}</p>`:'')
      : `<p class="small" style="text-align:center;margin-top:10px;cursor:pointer;color:#1a3a6b" onclick="LG_OUTRA=true;render()">Sou outra pessoa</p>`}
    <div id="lgMsg"></div></div>`));
  setTimeout(()=>document.getElementById('lgP')?.focus(),100);
}
let LG_OUTRA=false;
function normNome(s){ return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'') }
async function entrar(){
  const nomeDig=(document.getElementById('lgNome')||{}).value||'';
  const pin=document.getElementById('lgP').value.trim();
  const msg=document.getElementById('lgMsg');
  if(!nomeDig.trim()||!pin){ msg.innerHTML='<div class="alert">Digite seu nome e o PIN.</div>'; return }
  try{
    const h=await sha256(pin);
    if(!h){ msg.innerHTML='<div class="alert">Abra o app por HTTPS (GitHub Pages) — o navegador só valida o PIN em conexão segura.</div>'; return }
    const alvo=normNome(nomeDig);
    const achados=(USERS||[]).filter(u=>normNome(u.nome)===alvo);
    if(!achados.length){ msg.innerHTML='<div class="alert">🔴 Usuário não encontrado. Confira o nome ou use "Sou outra pessoa".</div>'; return }
    const uLeve=achados.find(u=>true);
    // busca o registro completo para conferir o pin (pode haver homônimo)
    let u=null;
    for(const cand of achados){
      const full=(await sb(`usuarios?select=*&id=eq.${cand.id}&ativo=eq.true`))[0];
      if(full && full.pin_hash===h){ u=full; break; }
    }
    if(!u){ msg.innerHTML='<div class="alert">🔴 PIN incorreto.</div>'; return }
    S.sessao={id:String(u.id),nome:u.nome,papel:u.papel,em:new Date().toISOString()};
    S.perfil=String(u.id); save();
    localStorage.setItem('rmc_ultimo_nome',u.nome); LG_OUTRA=false;
    if(DB) await dbCarregar();
    VIEW=''; render();
  }catch(e){ msg.innerHTML=`<div class="alert">Falha ao entrar: ${e.message}</div>` }
}
function sair(){ S.sessao=null; save(); render() }
const logado=()=>!ONLINE||!!S.sessao;

/* ---------------- boot ---------------- */
document.getElementById('perfil').onchange=e=>{ S.perfil=e.target.value; VIEW=''; DRAFT=null; save(); render() };
load();
conectar().then(render);
// atualização automática: o fornecedor acompanha sem precisar recarregar a página
setInterval(()=>{ if(DB&&logado()&&document.visibilityState==='visible') recarregar(true) },60000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&DB&&logado()) recarregar(true) });
window.estado=()=>S;   // usado nos testes
</script>
